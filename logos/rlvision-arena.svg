  <!-- Raised goals and the nearer transparent wall. -->
  <path d="M118 271V246L172 280V305" fill="#63c7ff" fill-opacity=".04" stroke="#63c7ff" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M118 246 105 251 159 285 172 280M159 285V309" stroke="#63c7ff" stroke-opacity=".26"/>
  <path d="M478 121V96L532 130V155" fill="#ffb166" fill-opacity=".04" stroke="#ffb166" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M478 96 491 91 545 125 532 130M545 125V150" stroke="#ffb166" stroke-opacity=".26"/>
  <path d="M55 231V199L235 313 595 163V195L235 345Z" fill="url(#glass)"/>
  <path d="M55 199 235 313 595 163" stroke="url(#rim)" stroke-opacity=".35"/>
  <path d="M55 231 235 345 595 195" stroke="url(#rim)" stroke-opacity=".75" stroke-width="1.3"/>
  <path d="M100 227.5V259.5M145 256V288M190 284.5V316.5M235 313V345M295 288V320M355 263V295M415 238V270M475 213V245M535 188V220" stroke="#a4d8bf" stroke-opacity=".14"/>

  <!-- The raised trajectory connects the replay to its analytical projection. -->
  <path d="M253 261C284 197 330 138 372 143S428 174 462 135" stroke="#b6ff86" stroke-opacity=".2" stroke-width="5" filter="url(#glow)"/>
  <path id="replay-trajectory" d="M253 261C284 197 330 138 372 143S428 174 462 135" stroke="#b6ff86" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M462 135V162" stroke="#b6ff86" stroke-opacity=".4" stroke-dasharray="3 4"/>
  <g fill="#10221a" stroke="#b6ff86" stroke-width="1.5">
    <circle cx="253" cy="261" r="3"/>
    <circle cx="282" cy="208" r="3"/>
    <circle cx="319" cy="162" r="3"/>
    <circle cx="372" cy="143" r="3"/>
    <circle cx="416" cy="154" r="3"/>
  </g>
  <circle cx="462" cy="135" r="14" fill="#b6ff86" fill-opacity=".12"/>
  <circle cx="462" cy="135" r="8.5" stroke="#b6ff86" stroke-opacity=".4"/>
  <circle cx="462" cy="135" r="4.5" fill="url(#ball)"/>
  <path d="M458 119H466M478 131V139" stroke="#b6ff86" stroke-opacity=".65"/>

  <!-- A glowing replay marker follows the existing trajectory. -->
  <g class="trajectory-pulse" opacity="0">
    <animateMotion dur="3.5s" repeatCount="indefinite" calcMode="paced">
      <mpath href="#replay-trajectory"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="3.5s" repeatCount="indefinite"/>
    <circle r="8" fill="#b6ff86" fill-opacity=".65" filter="url(#glow)"/>
    <circle r="7" stroke="#b6ff86" stroke-width="1.2">
      <animate attributeName="r" values="7;13" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".65;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#f2ffdf"/>
  </g>

</svg>
